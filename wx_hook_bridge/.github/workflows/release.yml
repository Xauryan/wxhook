name: Release DLL

on:
  push:
    tags:
      - "4.1.9.23-v[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Windows x64 DLL
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^4\.1\.9\.23-v[0-9]+$') {
            throw "Invalid release tag: $tag"
          }
          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ARCHIVE_NAME=wx_hook_bridge-$tag-win-x64.zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build DLL
        shell: pwsh
        run: |
          ./native/wx_hook_bridge/build.ps1 `
            -OutFile "${{ github.workspace }}/dist/wx_hook_bridge.dll"

      - name: Verify and package DLL
        shell: pwsh
        run: |
          $dll = "${{ github.workspace }}/dist/wx_hook_bridge.dll"
          if (!(Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "Build output not found: $dll"
          }

          $bytes = [System.IO.File]::ReadAllBytes($dll)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Build output is not a valid PE file: $dll"
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
            throw "Invalid PE header offset: $dll"
          }
          $signature = [BitConverter]::ToUInt32($bytes, $peOffset)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($signature -ne 0x00004550 -or $machine -ne 0x8664) {
            throw ('Expected a Windows x64 DLL, signature=0x{0:X8}, machine=0x{1:X4}' -f $signature, $machine)
          }

          $staging = Join-Path $env:RUNNER_TEMP "wx_hook_bridge-release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $staging "wx_hook_bridge.dll")
          Copy-Item -LiteralPath "${{ github.workspace }}/LICENSE" -Destination $staging

          $archive = Join-Path "${{ github.workspace }}/dist" $env:ARCHIVE_NAME
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force

          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFile = "$archive.sha256"
          "$checksum  $env:ARCHIVE_NAME" | Set-Content -LiteralPath $checksumFile -Encoding ascii

          "ARCHIVE_PATH=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM_PATH=$checksumFile" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            $env:ARCHIVE_PATH `
            $env:CHECKSUM_PATH `
            --verify-tag `
            --title $env:RELEASE_TAG `
            --generate-notes `
            --notes "Compatible WeChat version: 4.1.9.23"
