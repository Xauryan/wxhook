name: wechat-chat-panel
services:
  web:
    image: wechat-chat-panel-web:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:5174:8080"
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
