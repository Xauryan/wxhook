worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 128k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /healthz { return 200 "ok\n"; }
        location = / { return 302 /tasks; }
        location /api/task-center/ {
            set $task_api http://api:8795;
            proxy_pass $task_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_next_upstream off;
        }
        # The hosted task center never proxies local WeChat data or other server applications.
        location /api/ {
            default_type application/json;
            return 503 '{"code":"service_unavailable","message":"WeChat service is not connected."}';
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
        }
        location ~ /\. { deny all; }
    }
}
