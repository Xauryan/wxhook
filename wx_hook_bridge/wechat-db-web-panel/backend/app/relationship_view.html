<body>
<div class="top"><div><h1>关系分析</h1><div id="source" class="muted"></div></div><div class="actions"><button id="download-json">导出完整 JSON</button><button id="download-svg">保存当前关系图</button></div></div>
<div id="stats" class="stats"></div>
<nav class="tabs" role="tablist" aria-label="分析视图"><button role="tab" data-tab="graph" aria-selected="true">群关系图</button><button role="tab" data-tab="pairs" aria-selected="false">交集明细</button><button role="tab" data-tab="people" aria-selected="false">跨群群友</button><button role="tab" data-tab="groups" aria-selected="false">全部群</button></nav>
<div class="controls"><input id="search" type="search" aria-label="搜索群或群友" placeholder="搜索群名、群友名称或微信 ID"><label for="threshold">最少共同群友</label><select id="threshold"><option value="1">1 人 · 全部交集</option><option value="2">2 人</option><option value="3">3 人</option><option value="5" selected>5 人</option><option value="10">10 人</option><option value="20">20 人</option><option value="50">50 人</option></select><label style="display:flex;align-items:center;gap:6px"><input id="show-isolated" type="checkbox" style="min-width:0;flex:none">显示独立群</label><button id="reset">清除选择</button></div>
<div id="graph-view" class="chart-layout"><div class="chart-box"><div class="chart-title"><strong id="graph-caption"></strong><div class="actions"><button id="zoom-in" aria-label="放大关系图">＋</button><button id="zoom-out" aria-label="缩小关系图">−</button><button id="fit">适应画布</button></div></div><svg id="graph" class="graph" viewBox="0 0 1500 1000" role="img" aria-label="微信群关系图，群为节点，共同群友为连线。也可使用交集明细和全部群查看数据。" xmlns="http://www.w3.org/2000/svg"></svg><div id="tooltip" class="tooltip"></div><div class="legend"><span><span class="dot"></span>当前已加入群</span><span><span class="dot selected"></span>选中的群或交集</span><span>节点越大，群友越多；连线越粗，交集越大</span><span>拖动画布或用按钮缩放</span></div></div><aside id="inspector" class="inspector" aria-live="polite"></aside></div>
<div id="table-view" class="hidden"><div id="table-caption" class="muted" style="margin:0 0 10px"></div><div id="table" class="table-wrap"></div><div class="pager"><button id="prev">上一页</button><span id="page-status" class="muted"></span><button id="next">下一页</button></div></div>
<div class="note" id="note"></div>
<script id="relationship-data" type="application/json">__RELATIONSHIP_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('relationship-data').textContent),G=D.groups,P=D.people,E=D.edges;
if(document.documentElement.dataset.theme==='system')document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n.toLocaleString('zh-CN');
let mode='graph',selected=null,selectedEdge=null,selectedPerson=null,page=0,detailPage=0,detailQuery='',view=[0,0,1500,1000],visibleGroups=[],visibleEdges=[],totalPages=1;
const stats=D.meta.stats;
$('source').textContent=`${D.meta.display_name||D.meta.account} · ${D.meta.acquired_local} 读取 · 当前账号本机通讯录`;
$('stats').innerHTML=[['当前群',stats.groups],['去重群友（不含本人）',stats.unique_peers],['跨群群友',stats.cross_group_peers],['有交集的群对',stats.edges]].map(([label,n])=>`<div class="stat"><strong>${fmt(n)}</strong><span class="muted">${label}</span></div>`).join('');
$('note').textContent=`交集按微信 ID 去重，排除你本人；重名群友保留为不同成员。已导出本机当前 ${stats.groups} 个群和 ${fmt(stats.memberships_including_self)} 条成员关系，另保留 ${stats.historical_groups} 条非当前群记录。成员完整性仅覆盖本机已保存数据，未查询服务器完整名单。${stats.unnamed_peers?` ${stats.unnamed_peers} 位群友缺少名称，显示微信 ID。`:''}${stats.groups_missing_self?` ${stats.groups_missing_self} 个群的本机名单缺少本人，成员可能未完整同步。`:''}`;
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('download-json').onclick=()=>download(JSON.stringify(D,null,2),'application/json','wechat_groups.json');
$('download-svg').onclick=()=>{const svg=$('graph').cloneNode(true);svg.style.background='#fafcfe';svg.insertAdjacentHTML('afterbegin','<style>text{font:17px sans-serif;fill:#273e54;paint-order:stroke;stroke:#fafcfe;stroke-width:5px}circle{stroke:white;stroke-width:1.5}</style>');download(new XMLSerializer().serializeToString(svg),'image/svg+xml','wechat-relationships.svg')};
function q(){return $('search').value.trim().toLocaleLowerCase()}
const groupMatch=(g,s)=>[g.name,g.id,g.nickname,g.remark].some(x=>x.toLocaleLowerCase().includes(s));
const personMatch=(p,s)=>[p.name,p.id,p.nickname,p.remark].some(x=>x.toLocaleLowerCase().includes(s));
function computeLayout(){
 const n=G.length,edges=E.filter(e=>e.n>=5),connected=new Set(edges.flatMap(e=>[e.a,e.b])),pos=Array(n),adj=Array.from({length:n},()=>[]);
 for(const e of edges){adj[e.a].push(e.b);adj[e.b].push(e.a)}
 const seen=new Set(),components=[];
 for(const i of connected){if(seen.has(i))continue;const stack=[i],component=[];seen.add(i);while(stack.length){const g=stack.pop();component.push(g);for(const v of adj[g])if(!seen.has(v)){seen.add(v);stack.push(v)}}components.push(component.sort((a,b)=>a-b))}
 components.sort((a,b)=>b.length-a.length||a[0]-b[0]);
 let shelfX=50,shelfY=50,shelfHeight=0;
 for(const live of components){
  const width=Math.max(220,Math.min(780,Math.sqrt(live.length)*80)),height=width*.78;
  if(shelfX+width>1450){shelfX=50;shelfY+=shelfHeight+55;shelfHeight=0}
  const local=new Map(live.map((g,i)=>[g,i])),inside=edges.filter(e=>local.has(e.a)&&local.has(e.b)),k=Math.sqrt(width*height/live.length)*.66;
  live.forEach((g,i)=>{const angle=i*2.39996323,r=Math.sqrt((i+.5)/live.length)*width*.29;pos[g]=[width/2+Math.cos(angle)*r,height/2+Math.sin(angle)*r]});
  for(let t=0;t<200;t++){
   const force=live.map(()=>[0,0]),temp=7*(1-t/200)+.2;
   for(let ai=0;ai<live.length;ai++)for(let bi=ai+1;bi<live.length;bi++){
    const a=pos[live[ai]],b=pos[live[bi]],dx=a[0]-b[0],dy=a[1]-b[1],d=Math.max(1,Math.hypot(dx,dy));
    const min=18+.75*(Math.sqrt(G[live[ai]].peers)+Math.sqrt(G[live[bi]].peers)),f=k*k/(d*d)+(d<min?(min-d)*.8/d:0);
    force[ai][0]+=dx*f;force[ai][1]+=dy*f;force[bi][0]-=dx*f;force[bi][1]-=dy*f;
   }
   for(const e of inside){const a=pos[e.a],b=pos[e.b],dx=b[0]-a[0],dy=b[1]-a[1],d=Math.max(1,Math.hypot(dx,dy)),f=d/k*.13*Math.log1p(e.n),ai=local.get(e.a),bi=local.get(e.b);force[ai][0]+=dx*f;force[ai][1]+=dy*f;force[bi][0]-=dx*f;force[bi][1]-=dy*f;}
   live.forEach((g,i)=>{const f=force[i],p=pos[g];f[0]+=(width/2-p[0])*.15;f[1]+=(height/2-p[1])*.15;const d=Math.max(1,Math.hypot(...f));p[0]=Math.max(28,Math.min(width-28,p[0]+f[0]/d*Math.min(temp,d)));p[1]=Math.max(28,Math.min(height-28,p[1]+f[1]/d*Math.min(temp,d)))});
  }
  for(const g of live){pos[g][0]+=shelfX;pos[g][1]+=shelfY}
  shelfX+=width+55;shelfHeight=Math.max(shelfHeight,height);
 }
 const isolated=G.map((g,i)=>i).filter(i=>!connected.has(i)),isolateY=shelfY+shelfHeight+80;
 isolated.forEach((i,k)=>{pos[i]=[50+(k%24)*60,isolateY+Math.floor(k/24)*60]});
 return {pos,isolated,connected,isolateY};
}
const layout=computeLayout(),pos=layout.pos;
function setView(v){view=v;$('graph').setAttribute('viewBox',v.join(' '))}
function fit(){if(!visibleGroups.length)return setView([0,0,1500,1000]);const xs=visibleGroups.map(i=>pos[i][0]),ys=visibleGroups.map(i=>pos[i][1]),minX=Math.min(...xs)-65,minY=Math.min(...ys)-65,w=Math.max(240,Math.max(...xs)-minX+200),h=Math.max(170,Math.max(...ys)-minY+65),width=Math.max(w,h*1.5),height=width/1.5;setView([minX-(width-w)/2,minY-(height-h)/2,width,height]);}
function zoom(f){const[x,y,w,h]=view;const nw=Math.max(150,Math.min(3000,w*f)),nh=nw/1.5;setView([x+(w-nw)/2,y+(h-nh)/2,nw,nh])}
$('zoom-in').onclick=()=>zoom(.75);$('zoom-out').onclick=()=>zoom(1.3);$('fit').onclick=fit;
function chooseGroup(i){selected=i;selectedEdge=null;selectedPerson=null;detailPage=0;detailQuery='';page=0;mode='graph';render();fit()}
function chooseEdge(i){selectedEdge=i;selected=null;selectedPerson=null;detailPage=0;detailQuery='';mode='graph';render();const e=E[i];visibleGroups=[e.a,e.b];fit()}
function choosePerson(i){selectedPerson=i;selected=null;selectedEdge=null;detailPage=0;detailQuery='';mode='graph';render();fit()}
function wire(root){root.querySelectorAll('[data-group]').forEach(el=>el.onclick=()=>chooseGroup(+el.dataset.group));root.querySelectorAll('[data-edge]').forEach(el=>el.onclick=()=>chooseEdge(+el.dataset.edge));root.querySelectorAll('[data-person]').forEach(el=>el.onclick=()=>choosePerson(+el.dataset.person));}
const groupLink=i=>`<button data-group="${i}">${esc(G[i].name)}</button>`;
function membersHtml(indices){const filtered=indices.filter(i=>personMatch(P[i],detailQuery)),pages=Math.max(1,Math.ceil(filtered.length/60));detailPage=Math.min(detailPage,pages-1);return `<input id="detail-search" type="search" aria-label="搜索所选成员" placeholder="搜索成员名称或 ID" value="${esc(detailQuery)}"><ul class="people-list">${filtered.slice(detailPage*60,detailPage*60+60).map(i=>`<li><button data-person="${i}" style="border:0;padding:0;min-height:0;background:none;text-align:left">${esc(P[i].name)}</button><div class="id">${esc(P[i].id)} · ${P[i].groups.length} 个群${P[i].friend?' · 好友':''}</div></li>`).join('')||'<li class="muted">没有匹配成员</li>'}</ul><div class="pager"><button id="detail-prev" ${detailPage===0?'disabled':''}>上一页</button><span class="muted">${detailPage+1}/${pages} · ${filtered.length} 人</span><button id="detail-next" ${detailPage+1>=pages?'disabled':''}>下一页</button></div>`}
function inspector(){
 let html='';
 if(selectedEdge!==null){const e=E[selectedEdge];html=`<h2>共同群友 ${e.n} 人</h2><div class="link-list">${groupLink(e.a)}${groupLink(e.b)}</div><p class="muted">交集占两群群友并集 ${(e.j*100).toFixed(1)}%（Jaccard）</p>${membersHtml(e.shared)}`;}
 else if(selectedPerson!==null){const p=P[selectedPerson];html=`<h2>${esc(p.name)}</h2><p class="id">${esc(p.id)}</p><p>共同加入 <strong>${p.groups.length}</strong> 个群</p>${p.groups.map(i=>`<div class="pair">${groupLink(i)}<small>${G[i].peers} 位群友</small></div>`).join('')}`;}
 else if(selected!==null){const g=G[selected],pairs=E.map((e,i)=>({e,i})).filter(({e})=>e.a===selected||e.b===selected);html=`<h2>${esc(g.name)}</h2><div class="id">${esc(g.id)}</div><p>${g.local_member_count} 位本机成员（含本人）</p><p class="muted">${g.shared_peers} 位跨群群友 · 与 ${g.linked_groups} 个群存在交集</p><h3>交集群（全部非零交集）</h3>${pairs.slice(0,20).map(({e,i})=>`<button class="pair" data-edge="${i}"><span class="count">${e.n} 人</span>${esc(G[e.a===selected?e.b:e.a].name)}</button>`).join('')||'<p class="muted">本机名单暂无跨群交集</p>'}${pairs.length>20?`<p class="muted">其余 ${pairs.length-20} 个交集群可在交集明细中查看。</p>`:''}<h3>群友名单（不含本人）</h3>${membersHtml(g.members)}`;}
 else if(q()){const s=q(),gs=G.map((g,i)=>({g,i})).filter(({g})=>groupMatch(g,s)),ps=P.map((p,i)=>({p,i})).filter(({p})=>personMatch(p,s));html=`<h2>搜索结果</h2><p class="muted">${gs.length} 个群 · ${ps.length} 位群友</p>${gs.slice(0,15).map(({g,i})=>`<button class="pair" data-group="${i}">${esc(g.name)}<small>${g.peers} 位群友</small></button>`).join('')}${ps.slice(0,25).map(({p,i})=>`<button class="pair" data-person="${i}">${esc(p.name)}<small>${p.groups.length} 个群 · ${esc(p.id)}</small></button>`).join('')}${gs.length>15||ps.length>25?'<p class="muted">请细化搜索，或在对应明细页查看完整结果。</p>':''}`;}
 else{html=`<h2>交集最多的群</h2><p class="muted">点击任意群对查看全部共同成员。</p>${E.slice(0,7).map((e,i)=>`<button class="pair" data-edge="${i}"><span class="count">${e.n} 人</span>${esc(G[e.a].name)}<small>${esc(G[e.b].name)}</small></button>`).join('')||'<p class="muted">暂无群交集</p>'}<h3>加入群最多的群友</h3>${D.bridges.slice(0,5).map(i=>`<button class="pair" data-person="${i}"><span class="count">${P[i].groups.length} 群</span>${esc(P[i].name)}</button>`).join('')}`;}
 $('inspector').innerHTML=html;wire($('inspector'));
 const inp=$('detail-search');if(inp)inp.oninput=()=>{detailQuery=inp.value.toLocaleLowerCase();detailPage=0;const start=inp.selectionStart;inspector();$('detail-search').focus();$('detail-search').setSelectionRange(start,start)};
 if($('detail-prev'))$('detail-prev').onclick=()=>{detailPage--;inspector()};if($('detail-next'))$('detail-next').onclick=()=>{detailPage++;inspector()};
}
function graph(){
 const min=+$('threshold').value,s=q();let allowed=new Set(G.map((_,i)=>i));
 if(selected!==null){allowed=new Set([selected]);E.filter(e=>e.n>=min&&(e.a===selected||e.b===selected)).forEach(e=>{allowed.add(e.a);allowed.add(e.b)})}
 else if(selectedEdge!==null){allowed=new Set([E[selectedEdge].a,E[selectedEdge].b])}
 else if(selectedPerson!==null){allowed=new Set(P[selectedPerson].groups)}
 else if(s){allowed=new Set(G.map((g,i)=>groupMatch(g,s)?i:-1).filter(i=>i>=0));P.filter(p=>personMatch(p,s)).forEach(p=>p.groups.forEach(i=>allowed.add(i)))}
 else if(!$('show-isolated').checked){allowed=new Set(E.filter(e=>e.n>=min).flatMap(e=>[e.a,e.b]))}
 visibleGroups=[...allowed];visibleEdges=E.map((e,i)=>({e,i})).filter(({e})=>allowed.has(e.a)&&allowed.has(e.b)&&(e.n>=min||selectedEdge!==null));
 if(selectedEdge!==null)visibleEdges=visibleEdges.filter(({i})=>i===selectedEdge);
 $('graph-caption').textContent=`${visibleGroups.length} / ${G.length} 个群 · ${visibleEdges.length} 条连线 · ${selectedEdge!==null?'所选交集':`交集 ≥ ${min} 人`}`;
 const labels=new Set(visibleGroups.length<=25?visibleGroups:[...visibleGroups].sort((a,b)=>G[b].linked_groups-G[a].linked_groups).slice(0,14));
 const edgeMarkup=visibleEdges.map(({e,i})=>{const a=pos[e.a],b=pos[e.b],stroke=i===selectedEdge?'#a25c11':selected!==null?'#557ca5':'#8ea9c3',width=1+Math.log1p(e.n)*.65;return `<g class="edge" data-edge="${i}" tabindex="0" role="button" aria-label="${esc(G[e.a].name)} 与 ${esc(G[e.b].name)}，共同 ${e.n} 人"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${stroke}" stroke-width="${width}" opacity="${selected!==null||selectedEdge!==null?.8:.5}"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="12"/><title>${esc(G[e.a].name)} / ${esc(G[e.b].name)}：${e.n} 位共同群友</title></g>`}).join('');
 const nodeMarkup=visibleGroups.map(i=>{const g=G[i],[x,y]=pos[i],r=5+Math.sqrt(g.peers)*.75,focus=i===selected||selectedEdge!==null&&(E[selectedEdge].a===i||E[selectedEdge].b===i);return `<g class="node" data-group="${i}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(g.name)}，${g.peers} 位群友"><circle r="${r}" fill="${focus?'#a25c11':g.linked_groups?'#386b9f':'#8796a6'}"/><circle r="${Math.max(15,r)}" fill="transparent" stroke="none"/><title>${esc(g.name)}：${g.peers} 位群友，与 ${g.linked_groups} 个群有交集</title>${labels.has(i)?`<text x="${r+5}" y="5">${esc(g.name.length>18?g.name.slice(0,18)+'…':g.name)}</text>`:''}</g>`}).join('');
 $('graph').innerHTML=edgeMarkup+nodeMarkup+(visibleGroups.length?'':'<text x="550" y="480" fill="#758294" font-size="24">暂无达到当前交集阈值的群</text>');
 wire($('graph'));$('graph').querySelectorAll('[role=button]').forEach(el=>{el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};el.onpointerenter=e=>{const text=el.getAttribute('aria-label');$('tooltip').textContent=text;$('tooltip').style.display='block';const r=$('graph').getBoundingClientRect();$('tooltip').style.left=Math.min(e.clientX-r.left+10,r.width-200)+'px';$('tooltip').style.top=Math.max(50,e.clientY-r.top+45)+'px'};el.onpointerleave=()=>{$('tooltip').style.display='none'}});
 inspector();
}
function table(){const s=q(),min=+$('threshold').value;let rows,head,make;
 if(mode==='pairs'){rows=E.map((e,i)=>({e,i})).filter(({e})=>e.n>=min&&(!s||groupMatch(G[e.a],s)||groupMatch(G[e.b],s)||e.shared.some(i=>personMatch(P[i],s))));head=['群 A','群 B','共同群友','Jaccard','查看'];make=({e,i})=>`<tr><td>${groupLink(e.a)}</td><td>${groupLink(e.b)}</td><td class="numeric">${e.n} 人</td><td class="numeric">${(e.j*100).toFixed(1)}%</td><td><button data-edge="${i}">共同成员</button></td></tr>`;}
 else if(mode==='people'){rows=D.bridges.filter(i=>!s||personMatch(P[i],s)||P[i].groups.some(g=>groupMatch(G[g],s)));head=['群友','微信 ID','共同群数','是否好友','查看'];make=i=>`<tr><td>${esc(P[i].name)}</td><td class="id">${esc(P[i].id)}</td><td class="numeric">${P[i].groups.length}</td><td>${P[i].friend?'是':'否'}</td><td><button data-person="${i}">加入的群</button></td></tr>`;}
 else{rows=G.map((g,i)=>({g,i})).filter(({g})=>!s||groupMatch(g,s)||g.members.some(i=>personMatch(P[i],s)));head=['群名','本机成员（含本人）','跨群群友','有交集的群','群主'];make=({g,i})=>`<tr><td>${groupLink(i)}<div class="id">${esc(g.id)}</div></td><td class="numeric">${g.local_member_count}</td><td class="numeric">${g.shared_peers}</td><td class="numeric">${g.linked_groups}</td><td>${esc(g.owner_name||'未保存')}</td></tr>`;}
 totalPages=Math.max(1,Math.ceil(rows.length/60));page=Math.min(page,totalPages-1);$('table-caption').textContent=`${rows.length} 条结果${mode==='groups'?` · 仅展示当前已加入的 ${G.length} 个群，其他本地记录见导出`:mode==='pairs'?` · 当前交集 ≥ ${min} 人，选择「1 人」查看全部 ${E.length} 对交集`:''}`;
 $('table').innerHTML=rows.length?`<table><thead><tr>${head.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows.slice(page*60,page*60+60).map(make).join('')}</tbody></table>`:'<div class="empty">没有匹配结果</div>';
 $('page-status').textContent=`${page+1} / ${totalPages} 页`;$('prev').disabled=page===0;$('next').disabled=page+1>=totalPages;wire($('table'));
}
function saveState(){try{const state=new URLSearchParams({tab:mode,min:$('threshold').value,q:$('search').value});if(selected!==null)state.set('g',G[selected].id);if(selectedPerson!==null)state.set('p',P[selectedPerson].id);if(selectedEdge!==null)state.set('e',String(selectedEdge));history.replaceState(null,'','#'+state)}catch{}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===mode)));$('graph-view').classList.toggle('hidden',mode!=='graph');$('table-view').classList.toggle('hidden',mode==='graph');$('threshold').disabled=mode==='people'||mode==='groups';$('download-svg').disabled=mode!=='graph';if(mode==='graph')graph();else table();saveState()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;page=0;render()});
let searchTimer;$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{selected=null;selectedEdge=null;selectedPerson=null;page=0;render();fit()},150)};
$('threshold').onchange=()=>{page=0;render();fit()};$('show-isolated').onchange=()=>{render();fit()};$('reset').onclick=()=>{selected=null;selectedEdge=null;selectedPerson=null;detailQuery='';$('search').value='';page=0;render();fit()};$('prev').onclick=()=>{page--;table()};$('next').onclick=()=>{page++;table()};
let drag=null,moved=false;
$('graph').addEventListener('pointerdown',e=>{if(e.target.closest('[role=button]'))return;drag={x:e.clientX,y:e.clientY,view:[...view]};moved=false;$('graph').setPointerCapture(e.pointerId)});
$('graph').addEventListener('pointermove',e=>{if(!drag)return;const r=$('graph').getBoundingClientRect(),scale=Math.min(r.width/drag.view[2],r.height/drag.view[3]);setView([drag.view[0]-(e.clientX-drag.x)/scale,drag.view[1]-(e.clientY-drag.y)/scale,drag.view[2],drag.view[3]]);moved=true});
$('graph').addEventListener('pointerup',()=>{drag=null});
try{const state=new URLSearchParams(location.hash.slice(1));if(['graph','pairs','people','groups'].includes(state.get('tab')))mode=state.get('tab');if([...$('threshold').options].some(o=>o.value===state.get('min')))$('threshold').value=state.get('min');$('search').value=state.get('q')||'';if(state.has('g')){const i=G.findIndex(g=>g.id===state.get('g'));if(i>=0)selected=i}if(state.has('p')){const i=P.findIndex(p=>p.id===state.get('p'));if(i>=0)selectedPerson=i}if(state.has('e')&&/^\d+$/.test(state.get('e'))&&+state.get('e')<E.length)selectedEdge=+state.get('e')}catch{}
render();fit();document.documentElement.dataset.ready='true';
if(window.parent!==window){new ResizeObserver(()=>parent.postMessage({type:'wechat-relationships-height',height:document.body.scrollHeight},'*')).observe(document.body)}
</script></body></html>
