worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream task_center {
        zone task_center 64k;
        server jqr.47jsy.com:443 resolve;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/task-center/ {
            set $task_origin_ok 0;
            if ($http_origin = "$scheme://$http_host") { set $task_origin_ok 1; }
            if ($request_method ~ ^(GET|HEAD)$) { set $task_origin_ok 1; }
            if ($task_origin_ok = 0) { return 403; }
            proxy_pass https://task_center;
            proxy_ssl_server_name on;
            proxy_ssl_name jqr.47jsy.com;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host jqr.47jsy.com;
            proxy_set_header Cookie "tc_remote_session=$cookie_tc_remote_session";
            proxy_set_header Authorization "";
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_next_upstream off;
        }

        location /api/ {
            # Windows owns process verification, source files and native decoding.
            set $windows_api http://host.docker.internal:8765;
            proxy_pass $windows_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8765;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            # Never automatically retry an uncertain message submission.
            proxy_next_upstream off;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location ~ /\. {
            deny all;
        }
    }
}
